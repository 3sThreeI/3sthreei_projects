<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OG Image</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .card {
      width: 1200px;
      height: 630px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 72px;
      color: #f8fafc;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.06), transparent 35%),
        radial-gradient(circle at top right, rgba(148,163,184,0.16), transparent 30%),
        #0f172a;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 40px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 28px;
      pointer-events: none;
    }

    .content {
      max-width: 680px;
      z-index: 2;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(248,250,252,0.72);
      margin-bottom: 28px;
    }

    .title {
      font-size: 72px;
      line-height: 0.96;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 22px 0;
    }

    .subtitle {
      font-size: 28px;
      line-height: 1.35;
      max-width: 600px;
      color: rgba(248,250,252,0.78);
      margin: 0 0 30px 0;
    }

    .footer {
      display: inline-block;
      font-size: 20px;
      color: rgba(248,250,252,0.58);
      border-top: 1px solid rgba(255,255,255,0.14);
      padding-top: 18px;
    }

    .visual {
      width: 320px;
      height: 420px;
      z-index: 2;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03)),
        linear-gradient(135deg, #cbd5e1, #64748b);
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.12);
      position: relative;
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 24px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.20);
    }

    .accent {
      position: absolute;
      right: -120px;
      bottom: -120px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: rgba(180, 83, 9, 0.18);
      filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent"></div>

    <div class="content">
      <div class="brand">Your Brand</div>
      <h1 class="title">Professional Title Here</h1>
      <p class="subtitle">A refined subtitle that explains the value in one clear sentence.</p>
      <div class="footer">yourwebsite.com</div>
    </div>

    <div class="visual"></div>
  </div>
</body>
</html>
